# =============================================================================
# Build the backend image for arm64, push it to ECR, and roll the instance.
# =============================================================================
#
# WHY arm64. The instance is a Graviton t4g.small, so the image has to be arm64 or
# it will not start. This builds on `ubuntu-24.04-arm`, a native arm64 runner,
# rather than using QEMU emulation on an x86 runner. Emulating a build that
# compiles bcrypt and the web3/keccak stack from source turns a three-minute build
# into a twenty-minute one, and GitHub's arm64 runners are free on public repos.
#
# WHY OIDC AND NOT ACCESS KEYS. This workflow assumes an IAM role by exchanging a
# short-lived GitHub token for temporary AWS credentials. Nothing long-lived is
# stored in the repository. An access key in GitHub secrets is a credential that
# exists until someone remembers to rotate it; this one expires in an hour and
# cannot be used from anywhere except this repository's workflows.
#
# WHY SSM AND NOT SSH. The deploy step sends a command through Systems Manager
# rather than opening an SSH session, so port 22 is closed on the security group
# and there is no key to lose. The instance needs the AmazonSSMManagedInstanceCore
# policy on its instance role for this to work.
#
# SET UP BEFORE THIS RUNS (all in DEPLOYMENT.md):
#   - ECR repository `cryptodex-backend`
#   - GitHub OIDC identity provider in IAM
#   - Role `cryptodex-github-deploy` trusting this repo, with ECR push + SSM send
#   - Repository variables: AWS_REGION, AWS_ROLE_ARN, ECR_REPOSITORY, INSTANCE_ID
# =============================================================================

name: deploy

on:
  push:
    branches: [main]
    # Documentation changes should not rebuild a native-module image.
    paths-ignore: ['**.md', 'docs/**']
  workflow_dispatch:

concurrency:
  # A second push while the first is still rolling would race two `compose up`s
  # on the same host. Queue instead, and never cancel a half-finished deploy.
  group: deploy-production
  cancel-in-progress: false

permissions:
  id-token: write   # required to request the OIDC token
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Assume the deploy role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          set -euo pipefail
          # Two tags on one build: the commit sha is what actually gets deployed and
          # is what you roll back to; `latest` is a convenience for a manual pull.
          IMAGE="$REGISTRY/$REPOSITORY"
          docker build \
            --platform linux/arm64 \
            -f deploy/Dockerfile \
            -t "$IMAGE:${{ github.sha }}" \
            -t "$IMAGE:latest" \
            .
          docker push "$IMAGE:${{ github.sha }}"
          docker push "$IMAGE:latest"
          echo "IMAGE_URI=$IMAGE:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Roll the instance
        run: |
          set -euo pipefail
          # Deploy the immutable sha tag, not `latest`, so the instance runs exactly
          # what this workflow built and a re-run cannot pick up a different image.
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "deploy ${{ github.sha }}" \
            --parameters commands="[
              'set -euo pipefail',
              'cd /opt/cryptodex',
              'aws ecr get-login-password --region ${{ vars.AWS_REGION }} | docker login --username AWS --password-stdin ${{ steps.ecr.outputs.registry }}',
              'export ECR_IMAGE=${{ env.IMAGE_URI }}',
              'docker compose -f deploy/docker-compose.yml pull app',
              'docker compose -f deploy/docker-compose.yml up -d',
              'docker image prune -f'
            ]" \
            --query "Command.CommandId" --output text)

          echo "SSM command $CMD_ID dispatched, waiting"
          aws ssm wait command-executed \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.INSTANCE_ID }}" || true

          aws ssm get-command-invocation \
            --command-id "$CMD_ID" \
            --instance-id "${{ vars.INSTANCE_ID }}" \
            --query "{status:Status,out:StandardOutputContent,err:StandardErrorContent}" \
            --output text

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$CMD_ID" --instance-id "${{ vars.INSTANCE_ID }}" \
            --query Status --output text)
          [ "$STATUS" = "Success" ] || { echo "deploy failed: $STATUS"; exit 1; }

      - name: Verify the venue is actually up
        # The container being "up" is not the same as the venue working. /api/health
        # fans out to all three services and only answers 200 when every one of them
        # does, so this is the check that means something.
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 \
              "${{ vars.HEALTH_URL }}" || echo 000)
            [ "$code" = "200" ] && { echo "healthy after ${i} attempt(s)"; exit 0; }
            echo "attempt $i: $code"
            sleep 10
          done
          echo "never returned 200 — check: aws ssm start-session --target ${{ vars.INSTANCE_ID }}"
          exit 1
