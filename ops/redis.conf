# Local development redis for Cryptodex.
#
# THE ONLY SETTING HERE THAT MATTERS IS appendonly.
#
# The balance ledger (controllers/redis.controller.js, lib/ledger.js) is the
# source of truth for every spendable balance. A balance is a projection of it
# and is recomputed by replaying entries. That only holds if the entries
# survive a restart.
#
# With appendonly no - the default - redis keeps periodic RDB snapshots and
# nothing else, so a crash discards every entry written since the last one: up
# to an hour on a quiet venue. The balances would then be unrecoverable in
# exactly the situation the ledger exists for.
#
# `CONFIG SET appendonly yes` turns it on at runtime but does NOT survive a
# restart, and a restart is the event this is for. Hence a file.
#
# Start with:  redis-server ops/redis.conf
# Verify with: redis-cli CONFIG GET appendonly     -> yes
#              curl localhost:2568/api/health      -> "ledger":{"durable":true}
#
# ON RAILWAY (or any managed redis) this file does nothing - persistence is a
# setting on the addon. spotapi reports the answer either way rather than
# assuming it: see ledgerDurability() and the boot warning in server.js.

port 6379

# ---------------------------------------------------------------------------
# Durability
# ---------------------------------------------------------------------------
appendonly yes

# everysec, not always: `always` fsyncs on every write, which on the order hot
# path costs more than the exposure is worth for a paper venue. `everysec`
# bounds the loss at roughly one second of entries.
appendfsync everysec

# RDB snapshots are kept as well. They are not the durability story - the AOF
# is - but they make a cold start fast and cost nothing on a dataset this size.
save 3600 1
save 300 100
save 60 10000

# Where the AOF and RDB files go. Both are gitignored.
dir ./

# ---------------------------------------------------------------------------
# Everything below is ordinary local-development sizing, not a durability
# concern. Do not copy it to a production instance without reading it.
# ---------------------------------------------------------------------------

# A local dataset is small; this is a guard against a runaway test, not a tuning
# decision. noeviction so a full instance REFUSES writes rather than silently
# discarding ledger entries to make room - a ledger that evicts is not a ledger.
maxmemory 512mb
maxmemory-policy noeviction
