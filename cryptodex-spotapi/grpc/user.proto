syntax = "proto3";

service Req {
    rpc fetchUser (fetchUserReq) returns (fetchUserRes) {}
    rpc fetchBotUser (fetchBotUserReq) returns (fetchBotUserRes) {}
    rpc botUser (botUserReq) returns (botUserRes) {}

}

message fetchUserReq {
    string id = 1;
}
message fetchBotUserReq {
    string id = 1;
}
message fetchBotUserRes {
    string firstName = 1;
    string lastName = 2;
    string email = 3;
    string _id = 4;
    string userId = 5;
}
message botUserReq {
   string firstName = 1;
   string lastName = 2;
   string email = 3;
   string type = 4;
}

message botUserRes {
    bool status = 1;
}

message fetchUserRes {
    string _id = 1;
    string userCode = 2;
}

message Empty {}